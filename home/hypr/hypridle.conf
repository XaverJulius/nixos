general {
    lock_cmd = hyprlock
    before_sleep_cmd = hyprlock
    after_sleep_cmd = sleep 1 && hyprctl dispatch focusmonitor DP-3
    inhibit_sleep = 3
}

listener {
    timeout = 150
    on-timeout = hyprctl dispatch dpms off
}

listener {
    timeout = 152
    on-timeout = hyprlock
    on-resume = hyprctl dispatch dpms on
}
